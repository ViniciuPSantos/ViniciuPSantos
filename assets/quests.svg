<svg xmlns="http://www.w3.org/2000/svg" width="840" height="344" viewBox="0 0 840 344" role="img" aria-labelledby="title desc">
  <title id="title">Missões</title>
  <desc id="desc">Em andamento: Fluxen, SaaS de finanças pessoais em produção. Em andamento: Telegram Assistant, novos módulos no monitor de preços. Concluída: portfólio viniciusps.tech. Em andamento: ADS na São Judas, conclusão em 2028.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050913"/>
      <stop offset="1" stop-color="#0B1633"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#4DA3FF" stroke-opacity=".06"/>
    </pattern>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .qt{font-size:16px;font-weight:700;fill:#EAF4FF}
    .qd{font-size:13.5px;fill:#9DB7DA}
    .tag{font-size:10.5px;letter-spacing:1.5px;font-weight:700}
    .frame{animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{stroke-opacity:.7}50%{stroke-opacity:1}}
    .live{animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.frame,.live{animation:none}}
  </style>

  <rect x="10" y="10" width="820" height="324" rx="6" fill="url(#bg)"/>
  <rect x="10" y="10" width="820" height="324" rx="6" fill="url(#grid)"/>
  <rect class="frame" x="10" y="10" width="820" height="324" rx="6" fill="none" stroke="#4DA3FF" stroke-width="1.5" filter="url(#glow)"/>
  <g fill="none" stroke="#9CD0FF" stroke-width="3" stroke-linecap="square">
    <path d="M4 30V4H30"/><path d="M810 4H836V30"/><path d="M4 314V340H30"/><path d="M810 340H836V314"/>
  </g>

  <rect x="340" y="26" width="160" height="32" rx="3" fill="#0B1A3A" stroke="#4DA3FF" stroke-opacity=".6"/>
  <text x="420" y="47" text-anchor="middle" class="mono" font-size="14" font-weight="700" letter-spacing="6" fill="#EAF4FF">MISSÕES</text>

  <!-- 1 -->
  <rect x="40" y="88" width="128" height="22" rx="3" fill="#B07CFF" fill-opacity=".12" stroke="#B07CFF" stroke-opacity=".7"/>
  <circle class="live" cx="54" cy="99" r="3.5" fill="#B07CFF"/>
  <text x="112" y="103" text-anchor="middle" class="mono tag" fill="#B07CFF">EM ANDAMENTO</text>
  <text x="190" y="104" class="sans qt">Fluxen</text>
  <text x="190" y="126" class="sans qd">SaaS de finanças pessoais em produção: Spring Boot, React e VPS própria.</text>

  <!-- 2 -->
  <rect x="40" y="148" width="128" height="22" rx="3" fill="#B07CFF" fill-opacity=".12" stroke="#B07CFF" stroke-opacity=".7"/>
  <circle class="live" cx="54" cy="159" r="3.5" fill="#B07CFF"/>
  <text x="112" y="163" text-anchor="middle" class="mono tag" fill="#B07CFF">EM ANDAMENTO</text>
  <text x="190" y="164" class="sans qt">Telegram Assistant</text>
  <text x="190" y="186" class="sans qd">Novos módulos: Amazon e Mercado Livre no monitor de preços.</text>

  <!-- 3 -->
  <rect x="40" y="208" width="128" height="22" rx="3" fill="#5EEAD4" fill-opacity=".10" stroke="#5EEAD4" stroke-opacity=".7"/>
  <path d="M49 219l3.5 3.5L59 215" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="223" text-anchor="middle" class="mono tag" fill="#5EEAD4">CONCLUÍDA</text>
  <text x="190" y="224" class="sans qt">viniciusps.tech</text>
  <text x="190" y="246" class="sans qd">Portfólio novo em Astro, bilíngue, com terminal interativo.</text>

  <!-- 4 -->
  <rect x="40" y="268" width="128" height="22" rx="3" fill="#B07CFF" fill-opacity=".12" stroke="#B07CFF" stroke-opacity=".7"/>
  <circle class="live" cx="54" cy="279" r="3.5" fill="#B07CFF"/>
  <text x="112" y="283" text-anchor="middle" class="mono tag" fill="#B07CFF">EM ANDAMENTO</text>
  <text x="190" y="284" class="sans qt">ADS · São Judas</text>
  <text x="190" y="306" class="sans qd">Análise e Desenvolvimento de Sistemas, conclusão em 2028.</text>
</svg>
